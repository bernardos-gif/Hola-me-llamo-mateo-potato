# Base44 development environment for Shadow Clash.
# Runs the Vite dev server straight from the cloned source so edits hot-reload.
services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm install && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - .:/app
      # Anonymous volume keeps container installs from clobbering host node_modules.
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
